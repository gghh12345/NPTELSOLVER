<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPTEL Pro Solver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <div class="popup-header">
      <div class="logo-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <h2>NPTEL Pro Solver</h2>
        <span class="subtext">Official Bank & AI Companion</span>
      </div>
    </div>

    <div class="status-banner" id="popupStatusBanner">
      <span class="status-dot" id="popupStatusDot"></span>
      <span id="popupStatusText">Checking active tab...</span>
    </div>

    <div class="action-section">
      <button id="btnLaunchSidepanel" class="btn btn-primary btn-full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Open Side Panel
      </button>
    </div>

    <div class="info-grid">
      <div class="info-cell">
        <span class="cell-label">Answer Bank</span>
        <span class="cell-val">🟢 100% Verified</span>
      </div>
      <div class="info-cell">
        <span class="cell-label">AI Engine</span>
        <span class="cell-val">⚡ Gemini 2.5 Active</span>
      </div>
    </div>

    <div class="footer-note">
      Shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>N</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
